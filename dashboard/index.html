<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwayGuard</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="dashboard">
        <header>
            <div>
                <h1>SwayGuard</h1>
                <p>Trailer Stability Monitoring</p>
            </div>

            <div class="connection">
                <span id="connection-indicator"></span>
                <span id="connection-status">Waiting for telemetry</span>
            </div>
        </header>

        <section class="metrics">
            <article class="metric">
                <span class="metric-label">Speed</span>
                <strong id="speed">--</strong>
                <span class="metric-unit">mph</span>
            </article>

            <article class="metric">
                <span class="metric-label">Lateral Acceleration</span>
                <strong id="lateral-acceleration">--</strong>
                <span class="metric-unit">g</span>
            </article>

            <article class="metric">
                <span class="metric-label">Yaw Rate</span>
                <strong id="yaw-rate">--</strong>
                <span class="metric-unit">deg/s</span>
            </article>
        </section>
<section class="settings">
    <h2>Sway Detection</h2>

    <div class="settings-grid">
        <label>
            Warning Threshold
            <input
                id="warning-threshold"
                type="number"
                step="0.01"
                min="0.01"
            >
            <span>g</span>
        </label>

        <label>
            Alert Threshold
            <input
                id="alert-threshold"
                type="number"
                step="0.01"
                min="0.01"
            >
            <span>g</span>
        </label>

        <label>
            Brake Force
            <input
                id="brake-force"
                type="number"
                step="1"
                min="0"
                max="100"
            >
            <span>%</span>
        </label>
    </div>

    <button id="save-settings">
        Save Settings
    </button>

    <span id="settings-status"></span>
</section>
        <section class="device-information">
            <h2>Device</h2>

            <div class="device-row">
                <span>Device ID</span>
                <strong id="device-id">trailer-001</strong>
            </div>

            <div class="device-row">
                <span>Last Telemetry</span>
                <strong id="last-telemetry">--</strong>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
